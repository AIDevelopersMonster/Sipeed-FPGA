name: LAB-05 SD SPI RTL
on:
  pull_request:
    paths:
      - '01-PicoRV32/lab05/**'
      - '.github/workflows/lab05-spi-rtl.yml'
  workflow_dispatch:
jobs:
  spi-byte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run self-checking SPI mode-0 test
        shell: bash
        run: |
          set -euo pipefail
          cd 01-PicoRV32/lab05
          iverilog -g2012 -s tb_lab05_spi_byte -o /tmp/lab05.vvp rtl/lab05_spi_byte.v tests/tb_lab05_spi_byte.v
          vvp /tmp/lab05.vvp | tee /tmp/lab05.log
          grep -q 'LAB05_SPI_BYTE_TB_PASS' /tmp/lab05.log
