name: LAB-07.2 54MHz scripted preflight
on:
  push:
    paths:
      - 'boards/tang-nano-9k/experiments/psram07/tools/prepare_psram07.ps1'
      - 'boards/tang-nano-9k/experiments/psram07/tools/patch_psram_pll54.ps1'
      - 'boards/tang-nano-9k/experiments/psram07/tools/inspect_psram07_fit.ps1'
      - 'boards/tang-nano-9k/experiments/psram07/rtl/lab07_uart_result.v'
      - 'boards/tang-nano-9k/experiments/psram07/tests/tb_lab07_uart_result.v'
      - '.github/workflows/lab07-clock54-preflight.yml'
  pull_request:
    paths:
      - 'boards/tang-nano-9k/experiments/psram07/tools/prepare_psram07.ps1'
      - 'boards/tang-nano-9k/experiments/psram07/tools/patch_psram_pll54.ps1'
      - 'boards/tang-nano-9k/experiments/psram07/tools/inspect_psram07_fit.ps1'
      - 'boards/tang-nano-9k/experiments/psram07/rtl/lab07_uart_result.v'
      - 'boards/tang-nano-9k/experiments/psram07/tests/tb_lab07_uart_result.v'
      - '.github/workflows/lab07-clock54-preflight.yml'
  workflow_dispatch:
jobs:
  staged-source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PS scripts without invoking Gowin
        shell: pwsh
        run: |
          $folder = 'boards/tang-nano-9k/experiments/psram07/tools'
          foreach ($name in @('prepare_psram07.ps1','inspect_psram07_fit.ps1','patch_psram_pll54.ps1')) {
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath (Join-Path $folder $name)).Path,
              [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("$name " + $_.Message) }
              exit 1
            }
            if (-not $ast.ParamBlock) { throw "Missing parameters: $name" }
          }
          $s = Get-Content -LiteralPath (Join-Path $folder 'prepare_psram07.ps1') -Raw
          foreach ($marker in @(
              'LAB07_CLOCK54_REQUIRES_BUILD_AND_LEAN_UART',
              'patch_psram_pll54.ps1',
              'LAB07_CLOCK54_TOP_FINGERPRINT_MISMATCH',
              'LAB07_CLOCK54_STAGE_PASS',
              'inspect_psram07_fit.ps1'
          )) {
              if (-not $s.Contains($marker)) { throw "Missing clock safety marker: $marker" }
          }
          Write-Output 'LAB07_CLOCK54_POWERSHELL_AST_PASS'
      - name: Verify pinned upstream PLL patch with LF and CRLF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'boards/tang-nano-9k/experiments/psram07'
          $src = Join-Path $env:RUNNER_TEMP 'lab07_pinned_upstream'
          git clone -q https://github.com/zf3/psram-tang-nano-9k.git $src
          if ($LASTEXITCODE -ne 0) { throw 'LAB07_UPSTREAM_CLONE_FAIL' }
          git -C $src checkout -q --detach 394ae14a68f112729f79f78cbfc62a95d874d632
          if ($LASTEXITCODE -ne 0) { throw 'LAB07_UPSTREAM_PIN_FAIL' }
          $original = [System.IO.File]::ReadAllText((Join-Path $src 'src/gowin_rpll/gowin_rpll.v'))
          $cr = [string][char]13
          $lfChar = [string][char]10
          $lf = $original.Replace(($cr + $lfChar), $lfChar)
          $patcher = Join-Path $root 'tools/patch_psram_pll54.ps1'
          foreach ($mode in @('LF','CRLF')) {
            $raw = if ($mode -eq 'CRLF') { $lf.Replace($lfChar, ($cr + $lfChar)) } else { $lf }
            $file = Join-Path $env:RUNNER_TEMP "lab07_$mode.v"
            [System.IO.File]::WriteAllText($file,$raw,[System.Text.UTF8Encoding]::new($false))
            & $patcher -InputPath $file
            $actual = [System.IO.File]::ReadAllText($file)
            $expected = [regex]::Replace($raw,
              '(?m)^defparam rpll_inst\.FBDIV_SEL = 2;(?=[ \t]*\r?$)',
              'defparam rpll_inst.FBDIV_SEL = 1;')
            if ($actual -cne $expected) { throw "LAB07_CLOCK54_DIFF_FAIL: $mode" }
            Write-Output ('LAB07_CLOCK54_' + $mode + '_PATCH_PASS')
          }
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Validate terminal UART PASS/FAIL and reset
        shell: bash
        run: |
          set -euo pipefail
          d=boards/tang-nano-9k/experiments/psram07
          iverilog -g2012 -s tb_lab07_uart_result -o /tmp/lab07_uart.vvp "$d/rtl/lab07_uart_result.v" "$d/tests/tb_lab07_uart_result.v"
          vvp /tmp/lab07_uart.vvp | tee /tmp/lab07_uart.log
          grep -q LAB07_UART_TB_PASS /tmp/lab07_uart.log
          echo LAB07_CLOCK54_UART_TB_PASS
