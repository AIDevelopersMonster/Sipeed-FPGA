name: SD-04 FAT32 directory RTL
on:
  push:
    paths:
      - 'boards/tang-nano-9k/experiments/sd04-directory/**'
      - '.github/workflows/sd04-directory.yml'
  pull_request:
    paths:
      - 'boards/tang-nano-9k/experiments/sd04-directory/**'
      - '.github/workflows/sd04-directory.yml'
jobs:
  directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Test read-only directory parser
        run: |
          set -euo pipefail
          d=boards/tang-nano-9k/experiments/sd04-directory
          iverilog -g2005 -s tb_sd04_directory -o /tmp/sd04.vvp "$d/rtl/sd04_directory_parser.v" "$d/tests/tb_sd04_directory.v"
          vvp /tmp/sd04.vvp | tee /tmp/sd04.log
          grep -q SD04_DIRECTORY_TB_PASS /tmp/sd04.log
          iverilog -g2005 -s sd04_directory_probe_top -o /tmp/sd04_top.vvp "$d/../../cores/sdhc-spi-readonly/v1/rtl/spi_byte.v" "$d/../../cores/sdhc-spi-readonly/v1/rtl/sd_read_sector.v" "$d/rtl/sd03_mbr_parser.v" "$d/rtl/sd03_fat32_bpb.v" "$d/rtl/sd03_volume_scanner.v" "$d/rtl/sd04_directory_parser.v" "$d/rtl/uart_tx_8n1.v" "$d/rtl/sd04_uart_report.v" "$d/rtl/sd04_directory_probe_top.v"
          echo SD04_TOP_COMPILE_PASS
