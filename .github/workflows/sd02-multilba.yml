name: SD-02 Multi-LBA regression
on:
  push:
    paths:
      - 'boards/tang-nano-9k/experiments/sd-multilba/**'
      - '.github/workflows/sd02-multilba.yml'
  pull_request:
    paths:
      - 'boards/tang-nano-9k/experiments/sd-multilba/**'
      - '.github/workflows/sd02-multilba.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Verify LBA and CRC scenarios
        shell: bash
        run: |
          set -euo pipefail
          d=boards/tang-nano-9k/experiments/sd-multilba
          iverilog -g2012 -s tb_sd02_multilba -o /tmp/sd02.vvp "$d/rtl/spi_byte.v" "$d/rtl/sd_read_sector.v" "$d/tests/tb_sd02_multilba.v"
          vvp /tmp/sd02.vvp | tee /tmp/sd02.log
          grep -q SD02_MULTI_LBA_TB_PASS /tmp/sd02.log
          iverilog -g2005 -s sd02_multilba_probe_top -o /tmp/sd02_top.vvp "$d/rtl/spi_byte.v" "$d/rtl/sd_read_sector.v" "$d/rtl/uart_tx_8n1.v" "$d/rtl/sd02_multilba_probe_top.v"
          echo SD02_HARDWARE_TOP_VERILOG2005_COMPILE_PASS
